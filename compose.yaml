services:
  php:
    image: php:8.3-fpm
    build:
      context: .
      dockerfile: php.Dockerfile
    container_name: php
    volumes:
      - .:/var/www/html
      - ./php.ini:/usr/local/etc/php/php.ini
      - vendor:/var/www/html/vendor
    environment:
      - SYMFONY_ENV=dev
    depends_on:
      - mariadb
      - composer
      - node
    command: sh -c "chown -R www-data:www-data /var/www/html/var /var/www/html/public/build && php-fpm"

  mariadb:
    image: mariadb:latest
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: festival_iut
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony

    ports:
      - "3307:3306" # Le port local est maintenant 3307

    volumes:
      - db_data:/var/lib/mysql

  # mailpit:
  #   image: axllent/mailpit:latest
  #   container_name: mailpit
  #   ports:
  #     - "1025:1025"
  #     - "8025:8025"
  #   environment:
  #     - MAILPIT_RELAY=127.0.0.1:25
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mariadb # Nom du conteneur MariaDB
      PMA_PORT: 3306 # Port interne utilisé par phpMyAdmin
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80" # Accès à phpMyAdmin via le port 8081
    depends_on:
      - mariadb

volumes:
  db_data:
  vendor:
